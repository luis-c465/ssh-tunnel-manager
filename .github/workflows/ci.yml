name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: arduino/setup-protoc@v3
        with:
          version: "36.1"

      - name: Verify modules
        run: go mod verify

      - name: Install protobuf generators
        run: make proto-tools

      - name: Run checks
        run: make check
