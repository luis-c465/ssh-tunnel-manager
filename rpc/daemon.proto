syntax = "proto3";

package daemon;

option go_package = "github.com/besrabasant/ssh-tunnel-manager/rpc";

service DaemonService {
  rpc ListConfigurations (ListConfigurationsRequest) returns (ListConfigurationsResponse) {}

  rpc ListConfigurationsJSON (ListConfigurationsJSONRequest) returns (ListConfigurationsJSONResponse) {}

  rpc AddConfiguration (AddOrUpdateConfigurationRequest) returns (AddOrUpdateConfigurationResponse) {}

  rpc AddConfigurationJSON (AddOrUpdateConfigurationRequest) returns (MutationResponse) {}

  rpc UpdateConfiguration (AddOrUpdateConfigurationRequest) returns (AddOrUpdateConfigurationResponse) {}

  rpc UpdateConfigurationJSON (AddOrUpdateConfigurationRequest) returns (MutationResponse) {}

  rpc FetchConfiguration (FetchConfigurationRequest) returns (FetchConfigurationResponse) {}

  rpc DeleteConfiguration (DeleteConfigurationRequest) returns (DeleteConfigurationResponse) {}

  rpc DeleteConfigurationJSON (DeleteConfigurationRequest) returns (MutationResponse) {}

  rpc StartTunnel (StartTunnelRequest) returns (StartTunnelResponse) {}

  rpc KillTunnel (KillTunnelRequest) returns (KillTunnelResponse) {}

  rpc ListActiveTunnels (ListActiveTunnelsRequest) returns (ListActiveTunnelsResponse) {}

  rpc ListActiveTunnelsJSON (ListActiveTunnelsJSONRequest) returns (ListActiveTunnelsJSONResponse) {}

  rpc ListMachines (ListMachinesRequest) returns (ListMachinesResponse) {}

  rpc GetMachine (GetMachineRequest) returns (GetMachineResponse) {}

  rpc AddMachine (MachineMutationRequest) returns (MachineMutationResponse) {}

  rpc UpdateMachine (MachineMutationRequest) returns (MachineMutationResponse) {}

  rpc DeleteMachine (DeleteMachineRequest) returns (MachineMutationResponse) {}

  rpc ListTunnelProfiles (ListTunnelProfilesRequest) returns (ListTunnelProfilesResponse) {}

  rpc GetTunnelProfile (GetTunnelProfileRequest) returns (GetTunnelProfileResponse) {}

  rpc AddTunnelProfile (TunnelProfileMutationRequest) returns (TunnelProfileMutationResponse) {}

  rpc UpdateTunnelProfile (TunnelProfileMutationRequest) returns (TunnelProfileMutationResponse) {}

  rpc DeleteTunnelProfile (DeleteTunnelProfileRequest) returns (TunnelProfileMutationResponse) {}
}

message TunnelConfig {
  string name = 1;
  string description = 2;
  string server = 3;
  string user = 4;
  string key_file = 5;
  string remote_host = 6;
  int32 remote_port = 7;
  int32 local_port = 8;
}

message Machine {
  string id = 1;
  string name = 2;
  string server = 3;
  string user = 4;
  string key_file = 5;
}

message TunnelProfile {
  string id = 1;
  string name = 2;
  string description = 3;
  string machine_id = 4;
  string remote_host = 5;
  int32 remote_port = 6;
  int32 local_port = 7;
  optional Machine machine = 8;
}

enum ResponseStatus {
  Success = 0;
  Error = 1;
}

message ListMachinesRequest {}

message ListMachinesResponse {
  ResponseStatus status = 1;
  string message = 2;
  repeated Machine machines = 3;
}

message GetMachineRequest {
  string id = 1;
}

message GetMachineResponse {
  ResponseStatus status = 1;
  string message = 2;
  Machine data = 3;
}

message MachineMutationRequest {
  string id = 1;
  Machine data = 2;
}

message MachineMutationResponse {
  ResponseStatus status = 1;
  string message = 2;
  Machine data = 3;
}

message DeleteMachineRequest {
  string id = 1;
}

message ListTunnelProfilesRequest {}

message ListTunnelProfilesResponse {
  ResponseStatus status = 1;
  string message = 2;
  repeated TunnelProfile tunnel_profiles = 3;
}

message GetTunnelProfileRequest {
  string id = 1;
}

message GetTunnelProfileResponse {
  ResponseStatus status = 1;
  string message = 2;
  TunnelProfile data = 3;
}

message TunnelProfileMutationRequest {
  string id = 1;
  TunnelProfile data = 2;
}

message TunnelProfileMutationResponse {
  ResponseStatus status = 1;
  string message = 2;
  TunnelProfile data = 3;
}

message DeleteTunnelProfileRequest {
  string id = 1;
}

message ListConfigurationsRequest {
  string search_pattern = 1;
}

message ListConfigurationsResponse {
  string result = 1;
  repeated TunnelConfig configs = 2;
}

message ListConfigurationsJSONRequest {}

message ListConfigurationsJSONResponse {
  repeated TunnelConfig configs = 1;
}

message MutationResponse {
  ResponseStatus status = 1;
  string message        = 2;
  TunnelConfig data     = 3;
}

message AddOrUpdateConfigurationRequest {
  string name = 1;
  TunnelConfig data = 2;
}

message AddOrUpdateConfigurationResponse {
  string result = 1;
  ResponseStatus status = 2;
  string message = 3;
  TunnelConfig data = 4;
}

message FetchConfigurationRequest {
  string name = 1;
}

message FetchConfigurationResponse {
  ResponseStatus status = 1;
  string message = 2;
  TunnelConfig data = 3;
}

message DeleteConfigurationRequest {
  string name = 1;
}

message DeleteConfigurationResponse {
  string result = 1;
  ResponseStatus status = 2;
  string message = 3;
}

message StartTunnelRequest {
  string config_name = 1;
  int32 local_port = 2;
}

message StartTunnelResponse {
  string result = 1;
  ResponseStatus status = 2;
  string message = 3;
  repeated string events = 4;
}

message ListActiveTunnelsRequest {}

message ListActiveTunnelsResponse {
  string result = 1;
  repeated ActiveTunnel tunnels = 2;
}

message ActiveTunnel {
  string name        = 1;
  int32  local_port  = 2;
  string remote_addr = 3;
  string local_addr  = 4;
  string server      = 5;
}

message ListActiveTunnelsJSONRequest {}

message ListActiveTunnelsJSONResponse {
  repeated ActiveTunnel tunnels = 1;
}

message KillTunnelRequest {
  string config_name = 1;
  int32 local_port = 2;
}

message KillTunnelResponse {
  string result = 1;
  ResponseStatus status = 2;
  string message = 3;
}
